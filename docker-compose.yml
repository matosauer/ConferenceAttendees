services:
  conferenceattendees.api:
    image: ${DOCKER_REGISTRY-}conferenceattendees.api
    build:
      context: .
      dockerfile: ConferenceAttendees.Api/Dockerfile
    ports:
      - "5000:5178"
    depends_on:
      sql_server:
        condition: service_healthy
      seq_logs:
        condition: service_started
    environment:
      ConnectionStrings__ConferenceAttendeeDatabaseConnection: "Server=sql_server,1433;Database=ConferenceAttendeeDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=true"
    networks:
      - app-network

  conferenceattendees.ymvc:
    image: ${DOCKER_REGISTRY-}conferenceattendees.ymvc
    build:
      context: .
      dockerfile: ConferenceAttendees.YMVC/Dockerfile
    ports:
      - "8088:8080"
    depends_on:
      [conferenceattendees.api]
    networks:
      - app-network

  seq_logs:
    image: datalust/seq:latest
    restart: unless-stopped
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_PASSWORD: ${SEQ_PASSWORD:?Set SEQ_PASSWORD in .env}
    volumes:
      - seq_data:/data
    networks:
      - app-network
  
  sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    ports:
      - "1400:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  nginx:
    build:
      context: . 
      dockerfile: nginx/Dockerfile
    ports:
      - "44391:443"
    depends_on:
      - conferenceattendees.ymvc
    networks:
      app-network:
        aliases:
          - "conferenceattendees.com"
          - "api.conferenceattendees.com"
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  seq_data:
  sql_data:
